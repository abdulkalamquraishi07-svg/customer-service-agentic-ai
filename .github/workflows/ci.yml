name: CI

# Runs on every pull request and on pushes to main. Needs NO AWS credentials: the infrastructure
# is validated by synthesizing it offline and by assertion tests.
on:
  pull_request:
  workflow_call: # deploy.yml runs CI as its first gate (so main is never deployed untested)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CDK_CLI_VERSION: "2.1144.0"

jobs:
  python:
    name: Python (lint, types, tests, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            infra/requirements.txt
            services/agents/requirements.txt
            services/business_api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check
      - name: Lint
        run: ruff check .
      - name: Lint workflows
        run: actionlint
      - name: Type-check
        env:
          MYPYPATH: services/core/src:services/business_api/src:services/agents/src:services/kb_setup/src
        run: mypy services/core/src services/business_api/src services/agents/src services/kb_setup/src --explicit-package-bases
      - name: Test
        run: pytest -W ignore
      - name: Dependency audit
        # GHSA-464c-974j-9xm6: aws-cdk-lib CodeBuild S3LoggingOptions polarity bug. This project
        # does not use CodeBuild (asserted below), so it cannot be triggered. Revisit when the
        # CDK library is upgraded.
        run: |
          if grep -rIl --include='*.py' -i 'codebuild' infra/app.py infra/stacks; then
            echo "CodeBuild is now used: remove the GHSA-464c-974j-9xm6 ignore"; exit 1
          fi
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner off --ignore-vuln GHSA-464c-974j-9xm6

  web:
    name: Web (types, tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  infrastructure:
    name: Synthesize (${{ matrix.env }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        env: [dev, staging, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm install --global aws-cdk@${CDK_CLI_VERSION}
          npm ci --no-fund --prefix web
      - name: Build artifacts the stacks reference
        run: |
          python scripts/build_lambda.py
          python scripts/build_agent.py
          npm run build --prefix web
      - name: cdk synth (offline, no AWS credentials)
        working-directory: infra
        run: cdk synth -c env=${{ matrix.env }} --quiet
