name: Deploy environment (reusable)

on:
  workflow_call:
    inputs:
      env_name:
        description: dev, staging or prod
        type: string
        required: true

permissions:
  contents: read
  id-token: write # OIDC token for role assumption

env:
  AWS_REGION: us-east-1
  CDK_CLI_VERSION: "2.1144.0"

jobs:
  deploy:
    name: Deploy ${{ inputs.env_name }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env_name }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          npm install --global "aws-cdk@${CDK_CLI_VERSION}"
          npm ci --no-fund --prefix web
      - name: Build artifacts
        run: |
          python scripts/build_lambda.py
          python scripts/build_agent.py
          npm run build --prefix web
      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ inputs.env_name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        working-directory: infra
        # CloudFormation rolls a failed stack back automatically; a failed job stops promotion.
        run: cdk deploy --all -c env=${{ inputs.env_name }} --require-approval never --concurrency 2

  verify:
    name: Verify ${{ inputs.env_name }}
    needs: deploy
    runs-on: ubuntu-24.04
    environment: ${{ inputs.env_name }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Assume verify role (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_VERIFY_ROLE_ARN }}
          role-session-name: verify-${{ inputs.env_name }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Health check
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name csagent-${{ inputs.env_name }}-api \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${API_URL}health"
      - name: Sync knowledge base documents
        run: python scripts/sync_knowledge.py --env ${{ inputs.env_name }}
      # The remaining checks create and delete test customers, so they never run against prod.
      - name: Smoke test (business API)
        if: ${{ inputs.env_name != 'prod' }}
        run: python scripts/smoke_test.py --env ${{ inputs.env_name }}
      - name: Knowledge base retrieval canary
        if: ${{ inputs.env_name != 'prod' }}
        run: python evals/kb_canary.py --env ${{ inputs.env_name }}
      - name: Guardrail canary
        if: ${{ inputs.env_name != 'prod' }}
        run: python evals/guardrail_canary.py --env ${{ inputs.env_name }}
      - name: Hallucination check canary
        if: ${{ inputs.env_name != 'prod' }}
        run: python evals/grounding_canary.py --env ${{ inputs.env_name }} --check
      - name: Per-customer rate limit check
        if: ${{ inputs.env_name != 'prod' }}
        run: python evals/ratelimit_check.py --env ${{ inputs.env_name }}
      - name: End-to-end agent evals
        if: ${{ inputs.env_name != 'prod' }}
        run: python evals/run_evals.py --env ${{ inputs.env_name }}
      - name: Upload eval report
        if: ${{ always() && inputs.env_name != 'prod' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report-${{ inputs.env_name }}-${{ github.run_id }}
          path: build/evals/report.json
          if-no-files-found: ignore
          retention-days: 30
